<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22243b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LabMate">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>[hidden]{display:none!important}html,body{margin:0;height:100%;background:#22243b}</style>
</head><body>
<title>LabMate PC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: desktop app window on a lavender ground. Rail + glass menu (left, push-to-talk dock at the bottom), main column (search, week banner, cards), profile/tasks panel (right). Single dark look, as in Ilias's mockup. */
:root{
  --outer-1:#8f78e6; --outer-2:#d7b1f2;
  --bg:#22243b; --surface:#2d2f4d; --surface-2:#383a5d; --line:#46486f;
  --side:#5a4b98; --side-2:#6e5fb0; --aside:#282a44;
  --fg:#f1eefb; --muted:#a6a7ca;
  --accent:#a77bff; --accent-soft:#3d3168;
  --pink:#ff5cc6; --cyan:#3fe0f0; --blue:#4b6bff;
  --seed:#6fd39b; --seed-soft:#1f3a35; --transf:#4cc8e6; --transf-soft:#173a4a;
  --treat:#f0bd55; --treat-soft:#3d3220; --harv:#c4a6ff; --harv-soft:#352b58;
  --ana:#a5d873; --ana-soft:#283a24; --cold:#8ec9ff; --cold-soft:#1d3050;
  --warn:#ffb067; --warn-soft:#45301f; --ok:#6fd39b; --err:#ff8a86; --err-soft:#4a2230;
  --f-display:"Lato",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Lato",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
/* Mode clair (Paramètres) : pour les salles très lumineuses. Le menu violet garde son texte blanc. */
:root[data-lm-theme="light"]{
  --bg:#f6f4fc; --surface:#ffffff; --surface-2:#f0ecfa; --line:#ddd5f0; --aside:#efebf9;
  --fg:#1e1a38; --muted:#625d88;
  --seed:#1f8a55; --seed-soft:#dcf3e6; --transf:#137f99; --transf-soft:#d9f0f6;
  --treat:#9a6a00; --treat-soft:#fbefd2; --harv:#6c47c9; --harv-soft:#ebe3fb;
  --ana:#4c7d1c; --ana-soft:#e6f2d7; --cold:#2a6fb0; --cold-soft:#dde9f7;
  --warn:#a65a00; --warn-soft:#fdebd6; --ok:#1f8a55; --err:#c0362f; --err-soft:#fbe0de;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:relative;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font:700 22px/1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.conn{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:600 11px/1 var(--f-body);letter-spacing:.03em;padding:5px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--seed-soft);color:var(--seed)}
.pill.off{background:var(--err-soft);color:var(--err)}
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.weekbar strong{font:600 16px var(--f-display)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.iconbtn:focus-visible,.btn:focus-visible,.tab:focus-visible,.well:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{display:flex;flex-direction:column;gap:14px;padding-top:14px}
h2{font:700 18px/1.2 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 13px/1.2 var(--f-body);margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.banner{border-radius:var(--r);padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner.ex{background:var(--treat-soft);color:var(--fg)}
.banner.warn{background:var(--warn-soft)}
.banner.err{background:var(--err-soft)}
.banner.ok{background:var(--seed-soft)}
/* timeline */
.day{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}
.day .d{font:600 13px/1.2 var(--f-body);color:var(--muted);padding-top:8px}
.day .d b{display:block;font:700 20px/1 var(--f-display);color:var(--fg)}
.day.today .d b{color:var(--accent)}
.day.sun .d{color:var(--warn)}
.steps{display:flex;flex-direction:column;gap:6px;min-width:0}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%;background:var(--surface-2)}
.step .t{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.step .lbl{min-width:0;font-size:14px}
.step .lbl small{display:block;color:var(--muted);font-size:12px}
.step .chk{width:22px;height:22px;border-radius:6px;border:2px solid currentColor;display:grid;place-items:center;font-size:13px}
.step.seed{background:var(--seed-soft);color:var(--fg)} .step.seed .chk{color:var(--seed)}
.step.transf{background:var(--transf-soft)} .step.transf .chk{color:var(--transf)}
.step.treat{background:var(--treat-soft)} .step.treat .chk{color:var(--treat)}
.step.harv{background:var(--harv-soft)} .step.harv .chk{color:var(--harv)}
.step.ana{background:var(--ana-soft)} .step.ana .chk{color:var(--ana)}
.step.done .lbl{text-decoration:line-through;opacity:.65}
.step.done .chk::after{content:"✓"}
.empty-day{font-size:13px;color:var(--muted);padding:8px 0}
/* yield */
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--seed)}
.meter.over i{background:var(--err)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
/* manip cards */
.mcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.code{font:700 14px var(--f-mono);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.cold{background:var(--transf-soft);color:var(--transf)}
/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;font-size:15px;width:100%;min-width:0;font-weight:400}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 4px}
.trow{display:grid;grid-template-columns:1fr 92px 84px 34px;gap:6px;align-items:center}
@media (max-width:420px){.trow{grid-template-columns:1fr 1fr;}.trow .tname{grid-column:1/-1}}
.sheet{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--fg) 35%,transparent);display:flex;justify-content:center;align-items:flex-end}
.sheet .panel{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--bg);padding-block:6px;z-index:2}
/* plate */
.platewrap{overflow-x:auto}
.plate{display:grid;gap:4px;padding:10px;border-radius:14px;background:var(--surface-2);width:max-content;min-width:100%}
.plate .hd{border:0;background:transparent;padding:0;min-width:18px;font:600 11px var(--f-mono);color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:4px}
.well{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;font:600 9px/1 var(--f-mono);color:var(--fg);display:grid;place-items:center;padding:0;overflow:hidden}
.plate.dense .well{width:28px;height:28px;font-size:8px}
.plate.dish .well{width:120px;height:120px;font-size:13px}
.well.x{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 4px,var(--line) 4px,var(--line) 6px)}
.conds{display:flex;gap:6px;flex-wrap:wrap}
.cond{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px 5px 6px;cursor:pointer;font-size:13px}
.cond.active{border-color:var(--fg)}
.cond i{width:16px;height:16px;border-radius:50%;display:inline-block}
.cond em{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:11px}
/* agenda list */
.ev{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .s{font-size:14px;min-width:0;overflow-wrap:anywhere}
.ev .w{font:12px var(--f-mono);color:var(--muted)}
.st{font:600 11px var(--f-body);padding:4px 7px;border-radius:6px;white-space:nowrap}
.st.new{background:var(--seed-soft);color:var(--seed)}
.st.upd{background:var(--treat-soft);color:var(--treat)}
.st.same{background:var(--surface-2);color:var(--muted)}
.st.adopt{background:var(--transf-soft);color:var(--transf)}
.st.stock{background:var(--cold-soft);color:var(--cold)}
.st.reserved{background:var(--treat-soft);color:var(--treat)}
.st.used{background:var(--surface-2);color:var(--muted)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;cursor:pointer}
.item:last-child{border-bottom:0}
.item .s{min-width:0;overflow-wrap:anywhere}
.item .w{grid-column:1/-1;font-size:12px;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.pick label{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:14px;padding:6px 2px;color:var(--fg);font-weight:400}
.pick label small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .tag{font-family:var(--f-mono)}
.log{font:12px/1.5 var(--f-mono);background:var(--surface-2);border-radius:8px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
a{color:var(--accent)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:720px}
.tab{border:0;background:transparent;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* v3 : plans, conta, paillasse */
.tbl{overflow-x:auto;max-width:100%}
.tbl table{border-collapse:collapse;font-size:13px;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle;white-space:nowrap}
.tbl th{font-size:11px;color:var(--muted);font-weight:600}
.tbl input,.tbl select{padding:6px 7px;font-size:14px}
tr.ex td{opacity:.45;text-decoration:line-through}
.gel{display:grid;gap:3px;background:var(--surface-2);border-radius:10px;padding:6px;overflow-x:auto}
.lane{border:1px solid var(--line);background:var(--surface);border-radius:4px 4px 8px 8px;min-height:52px;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0;cursor:pointer;font:600 11px var(--f-mono);color:var(--fg)}
.lane span{font-size:9px;color:var(--muted)}
.lane.lad{background:var(--cold-soft);color:var(--cold)}
.lane.sel{outline:3px solid var(--accent);outline-offset:1px}
.p384{display:grid;grid-template-columns:14px repeat(24,minmax(15px,1fr));gap:2px;min-width:440px}
.p384 span{font:600 8px/1 var(--f-mono);display:grid;place-items:center;aspect-ratio:1;border-radius:3px}
.p384 .h{color:var(--muted);aspect-ratio:auto}
.p384 .w{color:#fff}
.p384 .w.e{background:var(--surface-2)}
.well.conta{box-shadow:0 0 0 2px var(--err)}
.well.conta-on{background-image:repeating-linear-gradient(-45deg,transparent,transparent 4px,color-mix(in srgb,var(--err) 55%,transparent) 4px,color-mix(in srgb,var(--err) 55%,transparent) 7px)!important}
.meter{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.pstep{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pstep:last-child{border-bottom:0}
.pstep.crit .pbody>.spread b{color:var(--accent)}
.pstep.done .pbody>.spread b{text-decoration:line-through;color:var(--muted)}
.pchk{width:34px;height:34px;border-radius:9px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;font-size:16px;cursor:pointer}
.pstep.done .pchk{background:var(--accent);color:#fff}
.pbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.pnote{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;background:var(--accent-soft);border-radius:8px;padding:6px 8px}
.pnote img{width:96px;border-radius:6px;background:#fff}
details.prev{background:var(--surface-2);border-radius:8px;padding:6px 8px}
details.prev summary{cursor:pointer;font-weight:600}
details.prev div{padding-top:4px}
canvas.ink{width:100%;border:1px solid var(--line);border-radius:10px;touch-action:none;background:#fff}
/* v4 */
label.row{flex-wrap:nowrap;align-items:flex-start}
label.row input{margin-top:3px;flex:none}
.calc .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.calc .r:last-child{border-bottom:0}
.calc .r b{font:600 14px var(--f-mono);text-align:right}
.calc .r small{grid-column:1/-1;color:var(--muted);font-size:12px}
.pick label small.w{color:var(--warn)}
.sheetbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:sticky;bottom:-20px;background:var(--bg);padding-block:8px}
.sheetbar .btn{flex:0 1 auto}
details.fold>summary h2{white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
details.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'▾';color:var(--muted);transition:transform .15s}
details.fold:not([open])>summary::after{transform:rotate(-90deg)}
details.fold>summary h2,details.fold>summary h3{margin:0}
details.fold[open]>summary{margin-bottom:10px}
.foldin{display:flex;flex-direction:column;gap:10px}
i.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.well{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.well .txd{display:flex;gap:2px;justify-content:center}
.well .txd i{width:7px;height:7px;border-radius:50%;border:1px solid #fff;display:block}
.plate.dense .well .txd i{width:5px;height:5px}
.well.dim{opacity:.35}
.well.hasTx{outline:2px solid var(--fg);outline-offset:1px}
.missrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;margin-top:6px;border-top:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
#bn-miss>span{display:flex;flex-direction:column;width:100%}

/* ================= LabMate PC : coque bureau ================= */
html,body{height:100%}
body{background:radial-gradient(120% 90% at 0% 0%,var(--outer-1),transparent 60%),radial-gradient(120% 120% at 100% 100%,var(--outer-2),transparent 55%),linear-gradient(135deg,var(--outer-1),var(--outer-2));background-color:var(--outer-1);color:var(--fg);font:15px/1.45 var(--f-body);padding-inline:22px;padding-block:22px;overflow:hidden}
::selection{background:var(--accent);color:#fff}
.app{height:100%;max-width:1680px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr) 280px;border-radius:20px;overflow:hidden;background:var(--bg);box-shadow:0 30px 80px -20px rgba(40,20,90,.55),0 0 0 1px rgba(255,255,255,.06)}
/* --- côté gauche : rail + menu + micro --- */
.side{display:grid;grid-template-columns:64px 1fr;grid-template-rows:minmax(0,1fr) auto;background:linear-gradient(180deg,var(--side-2),var(--side) 70%);position:relative;min-height:0}
.rail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0 18px;background:rgba(30,22,70,.28);border-right:1px solid rgba(255,255,255,.08);border-radius:0 34px 34px 0;margin-block:56px 40px;position:relative}
.dots{position:absolute;top:-44px;left:12px;display:flex;gap:7px}
.dots i{width:12px;height:12px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(140deg,var(--blue),var(--pink));box-shadow:0 6px 18px -4px rgba(255,92,198,.6);margin-bottom:12px}
.logo svg{width:26px;height:26px}
.rb{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;position:relative;color:#fff;background:var(--g,linear-gradient(140deg,#6d5bd0,#3b2f86));box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 6px 16px -6px rgba(0,0,0,.5);transition:transform .15s}
.rb:hover{transform:scale(1.06)}
.rb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.rb.on{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 0 0 4px rgba(63,224,240,.25),0 0 22px rgba(63,224,240,.45)}
.rb.on::before{content:"";position:absolute;left:-16px;top:50%;width:6px;height:22px;border-radius:0 6px 6px 0;background:var(--cyan);transform:translateY(-50%);box-shadow:0 0 10px var(--cyan)}
.rb.plus{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.rb .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);font:700 10px/18px var(--f-body);padding:0 5px}
.menu{color:#fff;display:flex;flex-direction:column;gap:4px;padding:18px 10px 12px 10px;min-height:0;overflow:auto}
.menu .mh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 6px 18px}
.menu .mh b{font:900 19px/1 var(--f-display);letter-spacing:.01em}
.menu .mh small{font:600 11px var(--f-mono);color:rgba(255,255,255,.65)}
.mi{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:rgba(255,255,255,.9);text-align:left;padding:10px 10px;border-radius:10px;cursor:pointer;font:600 14px var(--f-body);width:100%;white-space:nowrap}
.mi svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;opacity:.9}
.mi:hover{background:rgba(255,255,255,.08)}
.mi[aria-current="page"]{background:rgba(26,22,60,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.mi .n{margin-left:auto;font:700 11px var(--f-mono);color:rgba(255,255,255,.7)}
.msep{height:1px;background:rgba(255,255,255,.12);margin:10px 8px}
.voice{grid-column:1/-1;background:linear-gradient(180deg,rgba(28,24,62,.0),rgba(28,24,62,.55) 30%,var(--bg));padding:0 0 0;display:flex;flex-direction:column}
.voice canvas{width:100%;height:74px;display:block}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 16px;background:var(--bg);border-top:1px solid color-mix(in srgb,var(--fg) 5.0%,transparent)}
.vbar span{font:600 14px var(--f-body)}
.vbar small{display:block;font:400 11.5px var(--f-body);color:var(--muted)}
.mic{width:46px;height:50px;border:0;cursor:pointer;background:transparent;display:grid;place-items:center;position:relative;color:var(--fg)}
.mic.live{color:#fff}
.mic::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(140deg,var(--cyan),var(--accent) 55%,var(--pink))}
.mic::after{content:"";position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--bg)}
.mic svg{position:relative;z-index:1;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.mic.live::after{background:linear-gradient(140deg,#3d2c7a,#5d2a6e)}
/* --- centre --- */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid color-mix(in srgb,var(--fg) 5.0%,transparent)}
.topbar{height:58px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 24px;border-bottom:1px solid color-mix(in srgb,var(--fg) 5.0%,transparent);position:relative;z-index:15}
.search{position:relative;width:min(440px,100%)}
.search input{width:100%;border:1px solid color-mix(in srgb,var(--fg) 14.0%,transparent);background:color-mix(in srgb,var(--fg) 3.5%,transparent);border-radius:8px;padding:7px 12px 7px 34px;font-size:14px;text-align:center;color:var(--fg)}
.search input:focus{text-align:left;outline:none;border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:600 10px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px -10px rgba(0,0,0,.6);max-height:60vh;overflow:auto;padding:6px}
.sres button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer}
.sres button:hover,.sres button.sel{background:var(--surface-2)}
.sres .k{font:700 10px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);width:64px}
.sres small{color:var(--muted)}
main.scroll{flex:1;overflow:auto;min-height:0;padding:22px 26px 40px;scroll-behavior:auto}
section.view{display:flex;flex-direction:column;gap:18px;padding-top:0;max-width:1180px;margin:0 auto;width:100%}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vh h1{font:900 26px/1.1 var(--f-display);margin:0;letter-spacing:-.005em}
.vh p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.seeall{font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:2px 0}
.seeall:hover{color:var(--fg)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sect h2{font:700 15px var(--f-body);margin:0;padding-left:14px}
/* bannière semaine */
.hero{color:#fff;position:relative;height:178px;border-radius:18px;overflow:hidden;background:linear-gradient(110deg,#3d4cff,#9d4dff 45%,#ff5cc6 75%,#3fe0f0);box-shadow:0 18px 40px -18px rgba(120,80,255,.7)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .hi{pointer-events:none;position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:0 18px}
.hero .hc{text-align:center;min-width:0;text-shadow:0 2px 14px rgba(40,10,80,.45)}
.hero .eyebrow{font:700 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.hero .wk{font:900 clamp(22px,2.6vw,34px)/1.1 var(--f-display);margin:6px 0 8px;letter-spacing:-.01em}
.hero .meta{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hero .meta span{background:rgba(20,10,50,.32);backdrop-filter:blur(6px);border-radius:99px;padding:4px 10px;font:600 12px var(--f-body)}
.harrow{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(20,10,50,.25);backdrop-filter:blur(8px);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
.harrow:hover{background:rgba(20,10,50,.45)}
.hero .htools{position:absolute;top:12px;right:14px;display:flex;gap:6px;z-index:2}
.hero .htools button,.hero .htools input{background:rgba(20,10,50,.3);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:4px 9px;font:600 12px var(--f-body);cursor:pointer;backdrop-filter:blur(6px)}
.hero .htools input{width:auto;padding:3px 6px;color-scheme:dark}
/* cartes d'action */
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.acard{position:relative;border:0;padding:0;cursor:pointer;text-align:left;height:196px;border-radius:16px;overflow:hidden;background:#2a2550;box-shadow:0 14px 30px -14px rgba(0,0,0,.7);color:#fff;transition:transform .18s}
.acard:hover{transform:translateY(-3px)}
.acard canvas{position:absolute;inset:0;width:100%;height:100%}
.acard .glass{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(180deg,rgba(90,70,160,.55),rgba(60,40,120,.72));backdrop-filter:blur(14px);border-radius:50% 50% 0 0 / 26px 26px 0 0;padding:26px 16px 12px;display:flex;flex-direction:column;gap:4px}
.acard .ic{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;color:#3b2f86;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:2}
.acard .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
.acard b{font:700 19px/1.2 var(--f-display)}
.acard p{margin:0;font-size:12.5px;color:rgba(255,255,255,.78);line-height:1.35}
.acard .ft{margin-top:auto;display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.62)}
/* manips planifiées */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px}
.pcard{position:relative;display:grid;grid-template-columns:36% minmax(0,1fr);min-height:150px;border-radius:16px;overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 1px rgba(63,224,240,.35),0 14px 30px -16px rgba(0,0,0,.8)}
.pcard .art{position:relative;background:radial-gradient(120% 100% at 20% 10%,#4d3ab4,#1c1a3c 70%);display:grid;place-items:center;overflow:hidden;border-radius:0 46% 46% 0 / 0 50% 50% 0;cursor:pointer;border:0;padding:8px}
.pcard .art svg{width:100%;max-height:120px;filter:drop-shadow(0 0 10px rgba(63,224,240,.35))}
.pcard .art .cd{position:absolute;top:8px;left:10px;font:700 12px var(--f-mono);background:rgba(10,8,30,.55);color:#fff;border-radius:6px;padding:3px 6px}
.pcard .info{padding:14px 14px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.pcard .info b{font:700 17px/1.2 var(--f-display);overflow-wrap:anywhere}
.pcard .info p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .ft{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.pcard .acts2{display:flex;gap:4px;flex-wrap:wrap}
.pcard .acts2 button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 8px;font:600 11.5px var(--f-body);cursor:pointer;color:var(--fg)}
.pcard .acts2 button:hover{border-color:var(--accent)}
.prog{height:4px;border-radius:9px;background:color-mix(in srgb,var(--fg) 8.0%,transparent);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--accent),var(--pink))}
/* plan de la semaine en colonnes */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.bcol{background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:120px;border:1px solid transparent}
.bcol.today{border-color:var(--cyan);box-shadow:0 0 18px -6px var(--cyan)}
.bcol.out{opacity:.8;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.bcol h4{margin:0 0 4px;font:700 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.bcol h4 b{font:900 18px/1 var(--f-display);color:var(--fg);letter-spacing:0}
.bcol.today h4 b{color:var(--cyan)}
.board .step{grid-template-columns:1fr auto;padding:7px 8px;gap:6px}
.board .step .t{grid-column:1/-1;font-size:11px}
.board .step .lbl{font-size:13px}
.board .step .chk{width:18px;height:18px;grid-row:2;grid-column:2;font-size:11px}
.yrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
/* panneau droit */
.aside{display:flex;flex-direction:column;background:var(--aside);min-height:0}
.atop{height:58px;flex:none;display:flex;align-items:center;justify-content:space-around;border-bottom:1px solid color-mix(in srgb,var(--fg) 5.0%,transparent);padding:0 10px}
.atop button{border:0;background:transparent;color:var(--muted);width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center;position:relative}
.atop button:hover,.atop button[aria-pressed="true"]{color:var(--fg);background:color-mix(in srgb,var(--fg) 6.0%,transparent)}
.atop svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.atop .badge{position:absolute;top:4px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--pink);color:#fff;font:700 9.5px/16px var(--f-body);padding:0 4px}
.ascroll{flex:1;overflow:auto;padding:22px 18px 22px;display:flex;flex-direction:column;gap:16px;min-height:0}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.avatar{position:relative;width:150px;height:150px;border:0;background:transparent;padding:0;cursor:pointer}
.avatar canvas{position:absolute;inset:0;width:100%;height:100%}
.avatar .face{position:absolute;inset:27px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(150deg,#3a2c86,#8e3fb8 60%,#ff5cc6);display:grid;place-items:center;font:900 38px var(--f-display);color:#fff;background-size:cover;background-position:center}
.prof h2{font:700 18px var(--f-display);margin-top:6px}
.prof small{color:var(--muted);font-size:13px}
.conn{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ttl{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 -4px}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--fg) 7.0%,transparent);border-radius:8px;padding:10px 12px;min-height:52px;border:0;color:var(--fg);text-align:left;cursor:pointer;width:100%}
.task:hover{background:color-mix(in srgb,var(--fg) 10.0%,transparent)}
.task .t{font:600 11.5px var(--f-mono);color:var(--muted)}
.task .l{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.task .l small{display:block;color:var(--muted);font-size:11.5px}
.task .c{width:20px;height:20px;border-radius:6px;border:2px solid var(--cyan);display:grid;place-items:center;font-size:12px;color:var(--cyan)}
.task.done .l{text-decoration:line-through;opacity:.6}
.task.done .c::after{content:"✓"}
.task.warn .c{border-color:var(--warn);color:var(--warn)}
.task.ghost{background:transparent;border:1px dashed color-mix(in srgb,var(--fg) 12.0%,transparent);cursor:default;color:var(--muted);font-size:13px}
.tseg{display:flex;justify-content:center;gap:4px}
.tseg button{border:0;background:transparent;color:var(--muted);font:600 12px var(--f-body);padding:4px 10px;border-radius:99px;cursor:pointer}
.tseg button.on{background:color-mix(in srgb,var(--fg) 9.0%,transparent);color:var(--fg)}
/* Claude */
.claude{position:fixed;left:min(340px,calc(100% - 420px));bottom:34px;width:min(460px,calc(100% - 32px));max-height:min(620px,calc(100% - 80px));z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px -10px rgba(0,0,0,.7),0 0 0 1px rgba(167,123,255,.25);display:flex;flex-direction:column;overflow:hidden}
.claude .ch{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(63,224,240,.12),rgba(167,123,255,.12),rgba(255,92,198,.12))}
.claude .ch b{font:700 15px var(--f-display)}
.claude .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-soft)}
.msg.a{align-self:flex-start;background:var(--surface-2)}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;padding:0}
.msg .acts3{display:flex;flex-direction:column;gap:2px;margin-top:6px;font:12px var(--f-mono);color:var(--seed)}
.claude form{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border-top:1px solid var(--line)}
.claude textarea{min-height:44px;max-height:140px;font-size:14px}
.claude .hint{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(144px,1fr);gap:10px;overflow-x:auto;align-items:start;padding-bottom:6px}
.kcol{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:260px;border:1px dashed transparent}
.kcol.over{border-color:var(--cyan);background:color-mix(in srgb,var(--surface) 80%,var(--cyan) 8%)}
.kcol h3{display:flex;justify-content:space-between;align-items:center}
.kcol h3 i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.kcard{background:var(--surface-2);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab;border:1px solid transparent;user-select:none}
.kcard:hover{border-color:var(--line)}
.kcard.dragging{opacity:.4}
.kcard b{font-size:14px}
.kcard .w{font-size:12px;color:var(--muted)}
.sdots{display:flex;gap:3px}
.sdots i{width:16px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--fg) 12.0%,transparent)}
.sdots i.on{background:var(--cyan)}
.kcard .pin{font:600 10.5px var(--f-body);color:var(--warn)}
/* calculatrice */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px;align-items:start}
.unit{display:grid;grid-template-columns:1fr 92px;gap:6px}
.res{background:linear-gradient(120deg,rgba(63,224,240,.12),rgba(167,123,255,.14));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.res b{font:700 24px var(--f-mono);font-variant-numeric:tabular-nums}
.res small{color:var(--muted);font:12px var(--f-mono)}
.res.bad b{color:var(--warn);font-size:15px;font-family:var(--f-body)}
/* historique, backlog */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.wcard.cur{border-color:var(--cyan)}
.wcard h3{color:var(--fg);font-size:14px;letter-spacing:.02em;text-transform:none}
.cols2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.cols2>div{display:flex;flex-direction:column;gap:18px;min-width:0}
.prio{font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px}
.prio.haute{background:var(--err-soft);color:var(--err)}
.prio.normale{background:var(--transf-soft);color:var(--transf)}
.prio.basse{background:var(--surface-2);color:var(--muted)}
/* surcharges des composants v4 pour le bureau */
.card{border-radius:14px;border-color:color-mix(in srgb,var(--fg) 6.0%,transparent);padding:16px}
.btn{border-radius:9px;background:var(--surface-2);border-color:var(--line);color:var(--fg)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:linear-gradient(120deg,#7b5cff,#b25cff 60%,#ff5cc6);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.iconbtn{background:var(--surface-2);color:var(--fg)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--bg);border-color:var(--line);color:var(--fg)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.sheet{background:rgba(10,8,30,.6);backdrop-filter:blur(4px);align-items:center;padding:24px}
.sheet .panel{max-width:820px;border-radius:18px;max-height:88vh;background:var(--bg);border:1px solid var(--line);box-shadow:0 30px 80px -10px rgba(0,0,0,.7);padding:20px 22px}
.sheet .head{top:-20px}
.sheetbar{bottom:-20px}
.toast{bottom:28px;background:var(--fg);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.banner{border-radius:12px}
.step{background:var(--surface-2)}
.plate{background:var(--bg)}
.well{background:var(--surface-2)}
.log{background:var(--bg)}
.seg button.on{background:var(--accent-soft);color:var(--fg)}
.cond{background:var(--surface-2)}
.cond.active{border-color:var(--cyan)}

<script>window.LABMATE_CONFIG = {"clientId": ""};
/* LabMate autonome : remplace le pont claude.ai (window.claude) par Google Drive / Agenda en direct et l'API Claude (clé personnelle, facultative). */
(function(){
  const LS = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} } };
  const SCOPES = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar.events';
  const cfg = window.LABMATE_CONFIG || {};
  const G = { clientId: () => LS.get('lm_gclient') || cfg.clientId || '', apiKey: () => LS.get('lm_akey') || '' };
  let tok = null; try{ tok = JSON.parse(LS.get('lm_gtoken') || 'null'); }catch(e){}
  const tokenOk = () => tok && tok.exp > Date.now() + 60000;
  let gisPromise = null, tokenClient = null, pending = null;
  function loadGIS(){ return gisPromise || (gisPromise = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.onload = res; s.onerror = () => { gisPromise = null; rej({ code: 'server_unavailable', message: 'Google injoignable' }); }; document.head.appendChild(s); })); }
  async function requestToken(interactive){
    if(!G.clientId()) throw { code: 'needs_reauth', message: 'Identifiant client Google manquant (Paramètres)' };
    await loadGIS();
    return new Promise((resolve, reject) => {
      pending = { resolve, reject };
      tokenClient = google.accounts.oauth2.initTokenClient({ client_id: G.clientId(), scope: SCOPES, callback: r => {
        const p = pending; pending = null; if(!p) return;
        if(r.error) return p.reject({ code: 'needs_reauth', message: r.error_description || r.error });
        tok = { access_token: r.access_token, exp: Date.now() + (+r.expires_in || 3600) * 1000 }; LS.set('lm_gtoken', JSON.stringify(tok)); LS.set('lm_gconsent', '1'); p.resolve(tok.access_token);
      }, error_callback: e => { const p = pending; pending = null; if(p) p.reject({ code: 'needs_reauth', message: e?.type || 'connexion refusée' }); } });
      tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
    });
  }
  async function token(){ if(tokenOk()) return tok.access_token; if(!LS.get('lm_gconsent')) throw { code: 'needs_reauth', message: 'Pas encore connecté à Google' }; return requestToken(false); }
  async function gfetch(url, init = {}, retry = true){
    const t = await token(); const r = await fetch(url, { ...init, headers: { ...(init.headers || {}), Authorization: 'Bearer ' + t } });
    if(r.status === 401 && retry){ tok = null; LS.set('lm_gtoken', null); return gfetch(url, init, false); }
    if(!r.ok){ let m = ''; try{ m = (await r.json())?.error?.message || ''; }catch(e){} throw r.status === 401 || r.status === 403 && /auth|scope|permission/i.test(m) ? { code: 'needs_reauth', message: m } : { code: 'tool_error', message: `${r.status} ${m}` }; }
    return r;
  }
  const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const bin = atob(s); const u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  const API = 'https://www.googleapis.com/drive/v3', UP = 'https://www.googleapis.com/upload/drive/v3';
  const FIELDS = 'id,name,mimeType,parents,webViewLink,modifiedTime,fileExtension';
  const fileOut = f => ({ id: f.id, title: f.name, mimeType: f.mimeType, parentId: (f.parents || [])[0], viewUrl: f.webViewLink, modifiedTime: f.modifiedTime, fileExtension: f.fileExtension });
  const drive = {
    async search_files(i){
      let q = String(i.query || '').replace(/parentId\s*=\s*'([^']+)'/g, "'$1' in parents").replace(/\btitle\s+contains\b/g, 'name contains').replace(/\btitle\s*=/g, 'name =');
      q += (q ? ' and ' : '') + 'trashed = false';
      const u = new URL(API + '/files'); u.searchParams.set('q', q); u.searchParams.set('fields', `nextPageToken,files(${FIELDS})`); u.searchParams.set('pageSize', String(Math.min(+i.pageSize || 100, 1000))); u.searchParams.set('supportsAllDrives', 'true'); u.searchParams.set('includeItemsFromAllDrives', 'true'); if(i.pageToken) u.searchParams.set('pageToken', i.pageToken);
      const j = await (await gfetch(u)).json(); return { files: (j.files || []).map(fileOut), nextPageToken: j.nextPageToken };
    },
    async create_file(i){
      const meta = { name: i.title, ...(i.parentId ? { parents: [i.parentId] } : {}) };
      const hasContent = i.textContent != null || i.base64Content != null || i.content != null;
      let mime = i.contentMimeType || (hasContent ? 'text/plain' : 'application/vnd.google-apps.folder');
      if(!hasContent){ meta.mimeType = mime; const r = await gfetch(`${API}/files?supportsAllDrives=true&fields=${FIELDS}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) }); return fileOut(await r.json()); }
      if(!i.disableConversionToGoogleType){ const conv = { 'text/html': 'application/vnd.google-apps.document', 'text/plain': 'application/vnd.google-apps.document', 'text/csv': 'application/vnd.google-apps.spreadsheet' }[mime]; if(conv) meta.mimeType = conv; }
      const body = i.textContent != null ? new TextEncoder().encode(i.textContent) : unb64(i.base64Content || i.content);
      const bd = 'lm' + Math.random().toString(36).slice(2);
      const enc = new TextEncoder();
      const blob = new Blob([enc.encode(`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: ${mime}\r\n\r\n`), body, enc.encode(`\r\n--${bd}--`)]);
      const r = await gfetch(`${UP}/files?uploadType=multipart&supportsAllDrives=true&fields=${FIELDS}`, { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${bd}` }, body: blob });
      return fileOut(await r.json());
    },
    async trash_file(i){ await gfetch(`${API}/files/${encodeURIComponent(i.fileId)}?supportsAllDrives=true`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) }); return {}; },
    async download_file_content(i){
      const id = encodeURIComponent(i.fileId); let r;
      try{ r = await gfetch(`${API}/files/${id}?alt=media&supportsAllDrives=true`); }
      catch(e){ r = await gfetch(`${API}/files/${id}/export?mimeType=${encodeURIComponent(i.exportMimeType || 'text/plain')}`); }
      return { content: b64(await r.arrayBuffer()) };
    }
  };
  const CAL = 'https://www.googleapis.com/calendar/v3/calendars/';
  const evBody = i => ({ summary: i.summary, description: i.description, colorId: i.colorId, start: { dateTime: i.startTime, timeZone: i.timeZone }, end: { dateTime: i.endTime, timeZone: i.timeZone }, reminders: i.overrideReminders ? { useDefault: false, overrides: i.overrideReminders } : undefined });
  const cal = {
    async list_events(i){
      const u = new URL(CAL + encodeURIComponent(i.calendarId || 'primary') + '/events'); u.searchParams.set('timeMin', i.startTime); u.searchParams.set('timeMax', i.endTime); u.searchParams.set('singleEvents', 'true'); u.searchParams.set('orderBy', 'startTime'); u.searchParams.set('maxResults', String(i.pageSize || 250)); if(i.pageToken) u.searchParams.set('pageToken', i.pageToken);
      const j = await (await gfetch(u)).json(); return { events: j.items || [], nextPageToken: j.nextPageToken };
    },
    async create_event(i){ return (await gfetch(CAL + encodeURIComponent(i.calendarId || 'primary') + '/events?sendUpdates=none', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(evBody(i)) })).json(); },
    async update_event(i){ return (await gfetch(CAL + encodeURIComponent(i.calendarId || 'primary') + '/events/' + encodeURIComponent(i.eventId) + '?sendUpdates=none', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(evBody(i)) })).json(); }
  };
  const mcp = {
    async listTools(){ const ok = tokenOk() || !!LS.get('lm_gconsent'); const st = ok ? 'ok' : 'needs_reauth'; return { servers: [{ server: 'Google Drive', authStatus: st }, { server: 'Google Calendar', authStatus: st }] }; },
    async callTool(server, tool, input){ const h = server === 'Google Drive' ? drive : cal; if(!h[tool]) throw { code: 'tool_error', message: 'outil inconnu ' + tool }; return { payload: await h[tool](input || {}) }; }
  };
  const downloads = { async save({ filename, data }){ const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); return { ok: true }; } };

  /* Claude (clé API personnelle, facultatif) */
  const MODELS = { quick: 'claude-haiku-5-5', default: 'claude-sonnet-5-5' };
  async function toBlock(img){ const buf = await img.arrayBuffer(); return { type: 'image', source: { type: 'base64', media_type: img.type || 'image/jpeg', data: b64(buf) } }; }
  async function msgs(input, opts){
    const arr = Array.isArray(input) ? input.map(m => ({ role: m.role, content: m.content })) : [{ role: 'user', content: String(input) }];
    if(opts?.images){ const imgs = [].concat(opts.images); const blocks = await Promise.all(imgs.map(toBlock)); const last = arr[arr.length - 1]; last.content = [...blocks, { type: 'text', text: last.content }]; }
    return arr;
  }
  async function sample(input, opts = {}){
    const key = G.apiKey(); if(!key) throw { code: 'not_granted' };
    const messages = await msgs(input, opts); const tools = (opts.tools || []).map(t => ({ name: t.name, description: t.description, input_schema: t.inputSchema || { type: 'object', properties: {} } }));
    let text = '';

function stepsOf(m){

  server_unavailable: s => `${s} ne répond pas pour l'instant. Réessaie dans un moment.`,

  capability_disabled: () => `Les connecteurs ne sont pas disponibles dans cette vue. Ouvre la page dans claude.ai.`
};
function errText(e, server){ const f = ERR[e?.code]; return f ? f(server) : (e?.code === 'tool_error' ? `${server} a refusé l'opération : ${e.message}` : `Erreur ${server} : ${e?.message || e?.code || e}`); }
async function call(server, tool, input){
  if(!mcp) throw { code: 'not_granted' };
  const r = await mcp.callTool(server, tool, input, { cache: false });
  return r.payload;
}
function setPill(id, ok, label){ const p = $(id); p.className = 'pill ' + (ok === null ? '' : ok ? 'on' : 'off'); p.textContent = label; }
(async () => {
  try{ mcp = window.claude ? await window.claude.use('mcp') : null; }catch(e){ mcp = null; }
  if(!mcp){ mcpState = 'none'; setPill('#pill-drive', false, 'Drive indisponible'); setPill('#pill-cal', false, 'Agenda indisponible'); render(); return; }
  mcpState = 'ready';
  try{
    const r = await mcp.listTools();
    const names = r.servers.map(s => s.server);
    const st = n => { const s = r.servers.find(x => x.server === n); return !s ? false : s.authStatus === 'needs_reauth' ? false : true; };
    setPill('#pill-drive', st(DRIVE), names.includes(DRIVE) ? 'Drive' : 'Drive absent');
    setPill('#pill-cal', st(CAL), names.includes(CAL) ? 'Agenda' : 'Agenda absent');
  }catch(e){ setPill('#pill-drive', null, 'Drive'); setPill('#pill-cal', null, 'Agenda'); }
  render();
  loadRegistry(false);
})();

/* ================= Rendu ================= */
function render(){
  if(!S) return;
  $('#wk-label').textContent = `${fmtDM(S.week_start)} → ${fmtDM(addDays(S.week_start, 6))}`;
  $('#wk-date').value = S.week_start;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.v === view ? 'page' : 'false'));
  if(view === 'agenda') view = 'bench';
  ['week','manips','plate','agenda','drive','bench'].forEach(v => $('#v-' + v).hidden = v !== view);
  $('#banner-slot').innerHTML = S.example ? `<div class="banner ex" style="margin-top:12px"><span><b>Semaine d'exemple.</b> Ces manips montrent le fonctionnement ; rien n'est envoyé au Drive ni à l'agenda tant que l'exemple est affiché.</span><button class="btn sm" id="clear-ex">Commencer ma semaine</button></div>` : '';
  const ce = $('#clear-ex'); if(ce) ce.onclick = () => { store('lm_seen_example', true); S = blankWeek(S.week_start); save(); render(); };
  ({week:renderWeek, manips:renderManips, plate:() => window.renderPlate && renderPlate(), agenda:renderAgenda, drive:renderDrive, bench:() => window.renderBench && renderBench()})[view]();
}

function renderWeek(){
  const steps = allSteps();
  const lines = [...new Set(S.manipulations.map(m => m.cellLine))];
  const yieldCards = lines.map(l => {
    const ms = S.manipulations.filter(m => m.cellLine === l);
    const need = ms.reduce((a,m) => a + cellsPerPool(m), 0);
    const avail = parseCells(S.yields[l]);
    const pct = avail ? Math.round(need/avail*100) : 0;
    return `<div class="card">
      <div class="spread"><h3>${esc(l)} · besoin par dissociation</h3>${avail ? `<span class="st ${pct>100?'upd':'new'}">${pct} %</span>` : ''}</div>
      <div class="kv"><div><span>Besoin / pool</span><b>${fmtCells(need)}</b></div>
      <div><label class="f" for="y-${esc(l)}">Rendement / pool</label><input type="text" id="y-${esc(l)}" data-line="${esc(l)}" class="yield" placeholder="ex. 6M" value="${esc(S.yields[l]||'')}"></div>
      <div><span>Reste</span><b>${avail ? fmtCells(avail-need) : '—'}</b></div></div>
      ${avail ? `<div class="meter ${pct>100?'over':''}"><i style="width:${Math.min(100,pct)}%"></i></div>` : `<span class="small muted">Saisis le rendement compté après la dissociation pour vérifier que tout est ensemençable.</span>`}
      ${avail && pct > 100 ? `<span class="small" style="color:var(--err)">Il manque ${fmtCells(need-avail)} cellules par pool. Réduis des puits ou une densité dans Manips.</span>` : ''}
    </div>`;
  }).join('');
  const warns = checks();
  const last = steps.length ? steps[steps.length-1].date : addDays(S.week_start, 4);
  const nDays = Math.max(5, Math.round((Date.parse(last) - Date.parse(S.week_start))/864e5) + 1);
  const today = todayYMD();
  let days = '';
  for(let i=0;i<nDays;i++){
    const d = addDays(S.week_start, i), ss = steps.filter(s => s.date === d);
    if(dow(d) === 6 && !ss.length) continue;
    days += `<div class="day ${d===today?'today':''} ${dow(d)===6?'sun':''}"><div class="d">${DAYS[dow(d)]}<b>${d.slice(8)}</b></div><div class="steps">${
      ss.length ? ss.map(s => { const a = s.analysis; const done = a ? a.done : s.manip.progress?.[s.key]?.done; return `<button class="step ${STEP_META[s.type].cls} ${done?'done':''}" ${a ? `data-a="${a.id}"` : `data-m="${s.manip.id}" data-k="${s.key}"`} aria-pressed="${!!done}"><span class="t">${s.time}</span><span class="lbl"><b class="mono">${a ? a.code : s.manip.code}</b> ${esc(s.label)}<small>${a ? '' : esc(s.manip.title) + ' · '}${esc(s.sub)}</small></span><span class="chk"></span></button>`; }).join('')
      : `<div class="empty-day">Rien de prévu</div>`}</div></div>`;
  }
  $('#v-week').innerHTML = `
    ${S.manipulations.length ? '' : `<div class="card"><h2>Aucune manip cette semaine</h2><p class="muted small" style="margin:0">Ajoute les manips prévues après la dissociation du lundi, ou charge la semaine depuis le Drive.</p><div class="row"><button class="btn primary" data-go="add">Ajouter une manip</button><button class="btn" data-go="drive">Charger depuis le Drive</button></div></div>`}
    ${yieldCards}
    ${warns.length ? `<div class="banner warn"><span><b>À vérifier</b><br>${warns.map(esc).join('<br>')}</span></div>` : ''}
    ${S.manipulations.length || S.analyses.length ? `<div class="card"><div class="spread"><h3>Plan de la semaine</h3><span class="small muted">Touche une étape quand elle est faite</span></div>${days}</div>` : ''}`;
  document.querySelectorAll('.yield').forEach(i => i.onchange = () => { S.yields[i.dataset.line] = i.value.trim(); save(); renderWeek(); });
  document.querySelectorAll('.step[data-a]').forEach(b => b.onclick = () => { const a = S.analyses.find(x => x.id === b.dataset.a); setAnalysisDone(a, !a.done); renderWeek(); });
  document.querySelectorAll('.step[data-m]').forEach(b => b.onclick = () => {
    const m = S.manipulations.find(x => x.id === b.dataset.m); m.progress = m.progress || {};
    const p = m.progress[b.dataset.k] || {}; p.done = !p.done; p.at = p.done ? new Date().toISOString() : null; m.progress[b.dataset.k] = p; save(); renderWeek();
  });
  bindGo();
}
function bindGo(){ document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const g = b.dataset.go; if(g==='add') openEditor(null); else { view = g; store('lm_view', view); render(); } }); }

  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmSheet('Supprimer cette manip ?', 'Elle disparaît de la semaine dans LabMate. Les dossiers Drive et événements déjà créés ne sont pas touchés.', 'Supprimer', () => { S.manipulations = S.manipulations.filter(x => x.id !== b.dataset.del); renumber(); save(); renderManips(); }));

function defaultReadoutProto(ro){ ro = String(ro||''); return /arn|rna/i.test(ro) ? 'lab:arn-v1' : /prot/i.test(ro) ? 'lab:prot-v1' : ''; }

function eventKey(m, s){ return `${S.week_start}|${m.id}|${s.key}`; }
function plannedEvents(){
  return S.manipulations.flatMap(m => stepsOf(m).map(s => {
    const meta = STEP_META[s.type], total = fmtCells(totalCells(m));
    let summary;
    if(s.type==='seed') summary = `🌱 Seed ${m.code} ${m.title} — ${m.cellLine} ${m.platesPerDissoc*m.dissociationCount}× ${m.plateType} (${total})`;
    else if(s.type==='transf') summary = `🧬 Transfection ${m.code} ${m.transfection.name} ${m.transfection.conc}`.trim();
    else if(s.type==='treat') summary = `💊 ${m.code} ${s.label} (${s.sub})`;
    else summary = `🔬 Récolte ${m.code} ${m.readoutType} — ${m.downstreamAnalysis}${m.freeze80?' ❄️ −80 °C':''}`;
    const proto = m.readoutProtocol ? `${rpTitle(m.readoutProtocol)}${m.readoutProtocol.url ? ' ' + m.readoutProtocol.url : ''}` : (m.protocols?.length ? m.protocols.map(p => `${p.title} ${p.url}`).join(' ; ') : 'à ajouter');
    const description = [
      `Objectif : ${m.objective || '—'}`, `Lignée : ${m.cellLine}`,
      `Format : ${m.platesPerDissoc}× ${m.plateType} (${m.wellsCount} puits, ${m.cellCount}/puits)`,
      `Pools (N) : ${m.dissociationCount}`, `Cellules totales : ${total}`,
      `Protocole : ${proto}`, `Préparation : à compléter`, '', `LabMate : ${eventKey(m, s)}`
    ].join('\n');
    return { key: eventKey(m, s), summary, description, colorId: meta.color, start: parisISO(s.date, s.time), end: parisISO(s.date, addMinutes(s.time, s.dur)), date: s.date, time: s.time };
  })).concat(analysisSteps().map(s => {
    const a = s.analysis, labels = srcLabels(a);
    const summary = `🧪 ${a.code} ${a.type} — ${labels.length > 4 ? labels.slice(0,4).join(', ') + ' +' + (labels.length-4) : labels.join(', ') || 'plaques à choisir'}`;
    const lines = (a.sources||[]).map(x => { if(x.kind === 'stock'){ const it = stockItems().find(i => i.id === x.id); return `• ${x.label} (stock −80 °C${it?.location ? ', ' + it.location : ''}${it?.content ? ', ' + it.content : ''})`; } const m = S.manipulations.find(y => y.id === x.manipId); return `• ${x.label} (${m ? m.code + ' ' + m.title : 'manip de la semaine'})`; });
    const description = [`Analyse : ${a.type}`, `Échantillons (${lines.length}) :`, ...lines, a.notes ? `Notes : ${a.notes}` : '', `Préparation : ${lines.some(l => l.includes('−80')) ? 'sortir les échantillons du −80 °C' : 'à compléter'}`, '', `LabMate : ${S.week_start}|${a.id}|ana`].filter(x => x !== '').join('\n');
    return { key: `${S.week_start}|${a.id}|ana`, summary, description, colorId: STEP_META.ana.color, start: parisISO(s.date, s.time), end: parisISO(s.date, addMinutes(s.time, s.dur)), date: s.date, time: s.time };
  }));
}

async function compareAgenda(){
  busy = true; renderAgenda();
  try{
    const plan = plannedEvents();
    const last = plan.reduce((a,e) => e.date > a ? e.date : a, addDays(S.week_start, 6));
    let events = [], token;
    do{
      const p = await call(CAL, 'list_events', { calendarId: IDS.calendar, startTime: parisISO(S.week_start,'00:00'), endTime: parisISO(addDays(last, 1),'00:00'), pageSize: 250, orderBy:'startTime', ...(token ? {pageToken: token} : {}) });
      const pe = p?.events || []; events = events.concat(pe); token = pe.length ? p?.nextPageToken : null;
    } while(token);
    const keyOf = e => (String(e.description||'').match(/LabMate : (\S+)/) || [])[1];
    const used = new Set();
    const items = plan.map(ev => {
      let ex = events.find(e => keyOf(e) === ev.key);
      let status;
      if(ex){ const same = ex.summary === ev.summary && Date.parse(ex.start?.dateTime) === Date.parse(ev.start) && Date.parse(ex.end?.dateTime) === Date.parse(ev.end) && String(ex.description||'').trim() === ev.description.trim() && String(ex.colorId||'') === ev.colorId; status = same ? 'same' : 'upd'; }
      else { ex = events.find(e => !keyOf(e) && e.summary === ev.summary && Date.parse(e.start?.dateTime) === Date.parse(ev.start)); status = ex ? 'adopt' : 'new'; }
      if(ex) used.add(ex.id);
      return { ev, status, existing: ex ? ex.id : null };
    });
    const orphans = events.filter(e => { const k = keyOf(e); return k && k.startsWith(S.week_start + '|') && !used.has(e.id); });
    agendaPlan = { items, orphans, log: '' };
  }catch(e){ agendaPlan = null; toast(errText(e, 'Google Agenda')); }
  busy = false; renderAgenda();
}
async function applyAgenda(){
  busy = true; const lines = []; renderAgenda();
  for(const it of agendaPlan.items.filter(i => i.status !== 'same')){
    const e = it.ev;
    const body = { calendarId: IDS.calendar, summary: e.summary, description: e.description, startTime: e.start, endTime: e.end, timeZone: TZ, colorId: e.colorId, overrideReminders: [{method:'popup', minutes:30}] };
    try{
      if(it.existing){ await call(CAL, 'update_event', { ...body, eventId: it.existing, notificationLevel:'NONE' }); lines.push('✓ mis à jour  ' + e.summary); }
      else { await call(CAL, 'create_event', body); lines.push('✓ créé  ' + e.summary); }
      it.status = 'same';
    }catch(err){ lines.push('✗ ' + e.summary + ' : ' + errText(err, 'Google Agenda')); if(['needs_reauth','server_not_connected','not_in_manifest','not_granted'].includes(err?.code)) break; }
  }
  agendaPlan.log = lines.join('\n'); busy = false; renderAgenda(); toast('Agenda mis à jour');
}

let protoLib = store('lm_protolib') || [];

function effProto(p){

}
function allProtos(){ const lib = protoLib.filter(p => p && p.id); const ids = new Set(lib.map(p => p.id)); return BUILTIN_PROTOS.filter(b => !ids.has(b.id)).concat(lib).map(effProto); }
function protoById(id){ return id ? allProtos().find(p => p.id === id) : null; }
function protoSteps(p){ return (p?.sections||[]).flatMap(s => s.steps||[]); }
function stepMissing(st){ return !String(st.detail||'').trim() || /à préciser/i.test(st.detail + ' ' + (st.meta||'')); }
function patchProto(id, kind, key, val){ protoPatch[id] = protoPatch[id] || {}; protoPatch[id][kind] = protoPatch[id][kind] || {}; protoPatch[id][kind][key] = Object.assign(protoPatch[id][kind][key] || {}, val); store('lm_protopatch', protoPatch); }

async function loadProtoLib(){

    const files = (p?.files||[]).filter(f => /^proto_.*\.json$/.test(f.title));
    const out = [];
    for(const f of files){ try{ const d = await call(DRIVE, 'download_file_content', { fileId: f.id }); const j = JSON.parse(b64ToText(d.content)); j.driveFileId = f.id; out.push(j); }catch(e){} }

/* ---------- calculateur des tampons ---------- */
function fmtVol(ul, unit){ if(ul == null || !isFinite(ul)) return '—'; if(unit === 'pastille') return `${f1(ul, 2)} pastille`; return ul >= 1000 ? `${f1(ul/1000, 2)} mL` : `${f1(ul, 1)} µL`; }
function calcRows(p, N, P){
  N = Math.max(0, +N || 0); P = Math.max(1, +P || 1);
  const out = {}, rows = [];
  (p?.reagents||[]).forEach(r => {
    if(r.fixed){ rows.push({ r, txt: r.fixed }); return; }
    if(r.per == null || r.per === ''){ rows.push({ r, missing: true }); return; }
    const per = +r.per, margin = r.margin ?? p.margin ?? 1;
    let total, how;
    if(r.basis === 'qpcr'){ const wells = N*3 + 1 + 3; total = per * wells * (r.perPrimer ? 1 : P); how = `${per} µL × ${wells} puits${r.perPrimer ? ' (par amorce)' : ` × ${P} amorce(s)`}`; }
    else if(r.basis === 'bca'){ const wells = 6 + N + 1; total = per * wells; how = `${per} µL × ${wells} puits`; }
    else if(r.basis === 'perMlOf'){ const ref = out[r.ref] || 0; total = per * ref / 1000; how = `${per}${r.unit === 'pastille' ? '' : ' µL'} / mL × ${f1(ref/1000, 2)} mL`; }
    else { total = per * (N + margin); how = `${per} µL × ${margin ? `(${N} + ${margin})` : N}`; }
    out[r.id] = total; rows.push({ r, total, how });
  });
  return rows;
}
function calcHTML(p, N, P, opts = {}){
  if(!p?.reagents?.length) return '<span class="small muted">Ce protocole n\'a pas de tampons à calculer.</span>';
  const rows = calcRows(p, N, P);
  return `<div class="row"><label class="f" for="${opts.id||'calc'}-n" style="max-width:150px">Échantillons (N)<input type="number" min="0" max="400" id="${opts.id||'calc'}-n" value="${+N||0}"></label>${p.reagents.some(r => r.basis === 'qpcr') ? `<label class="f" for="${opts.id||'calc'}-p" style="max-width:150px">Amorces<input type="number" min="1" max="40" id="${opts.id||'calc'}-p" value="${+P||1}"></label>` : ''}</div>
    <div class="calc">${rows.map(x => `<div class="r"><span>${esc(x.r.name)}</span>${x.missing ? `<button class="btn sm" data-fixreag="${esc(x.r.id)}" style="color:var(--warn)">À préciser</button>` : `<b>${x.txt ? '' : esc(fmtVol(x.total, x.r.unit))}</b>`}<small>${esc([x.txt || x.how, x.r.note && x.missing ? x.r.note : x.r.note].filter(Boolean).join(' · '))}</small></div>`).join('')}</div>`;
}

function contaList(m){ const c = m.plate?.conta || {}; const gs = groupsOf(m.plate || {}, m.treatments); const out = []; Object.entries(c).forEach(([p, wells]) => Object.entries(wells||{}).forEach(([w, note]) => { const g = gs.find(x => x.wells.includes(w)); out.push({ pool: p, well: w, cond: g ? g.name : '—', note: note === true ? '' : note }); })); return out.sort((a,b) => (a.pool+a.well).localeCompare(b.pool+b.well)); }

function pdfPlate(doc, m){
  const plate = m.plate || {conds:[], wells:{}};
  const groups = groupsOf(plate, m.treatments); const gi = {}; groups.forEach((g,i) => g.wells.forEach(k => gi[k] = i));
  const [R,C] = PRESETS.plates[m.plateType] || [4,6]; const rows = 'ABCDEFGHIJKLMNOP'.slice(0,R).split('');
  const size = R*C === 1 ? 30 : Math.min(12, 160/(C+1)); ensureY(doc, (R+1)*size + 14);
  const x0 = 18, y0 = doc.__y; doc.setFontSize(7);
  for(let c=1;c<=C;c++) doc.text(String(c), x0 + c*size, y0 + 3, { align:'center' });
  rows.forEach((r, ri) => { const y = y0 + (ri+1)*size; doc.setTextColor(91,107,121); doc.text(r, x0, y + 1, { align:'center' }); doc.setTextColor(22,33,43);
    for(let c=1;c<=C;c++){ const k = r+c, g = gi[k] != null ? groups[gi[k]] : null, x = x0 + c*size, rad = size*0.42;
      if(g){ doc.setFillColor(...rgb(g.color)); doc.setDrawColor(...rgb(g.color)); doc.circle(x, y, rad, 'FD'); doc.setTextColor(255); doc.setFontSize(R*C===1 ? 9 : 6); doc.text('G' + gi[k], x, y + 1, { align:'center' }); doc.setTextColor(22,33,43); doc.setFontSize(7); }
      else { doc.setDrawColor(190); doc.setFillColor(255); doc.circle(x, y, rad, 'FD'); }
      if(plate.wells?.[k] === 'x'){ doc.setDrawColor(120); doc.line(x-rad*.6, y-rad*.6, x+rad*.6, y+rad*.6); doc.line(x-rad*.6, y+rad*.6, x+rad*.6, y-rad*.6); }
      const pools = Object.entries(plate.conta||{}).filter(([p, w]) => w && w[k]).map(([p]) => p);
      if(pools.length){ doc.setDrawColor(180,35,24); doc.setLineWidth(.5); doc.circle(x, y, rad + .6, 'S'); doc.setLineWidth(.2); doc.setTextColor(180,35,24); doc.setFontSize(5); doc.text(pools.join(','), x, y + rad + 2.6, { align:'center' }); doc.setTextColor(22,33,43); doc.setFontSize(7); } } });
  doc.__y = y0 + (R+1)*size + 4;
  if(groups.length) table(doc, ['Groupe','Composition','Traitements','Puits / pool'], groups.map((g,i) => [`G${i}`, g.name, g.tx.map(t => `${t.name} ${offsetLabel(t.dayOffset)} ${t.timeDetail||''}`).join(' puis ') || '-', String(g.wells.length)]));
  const cl = contaList(m); if(cl.length) para(doc, 'Conta (puits non analysables, cerclés en rouge) : ' + cl.map(c => `${c.pool} ${c.well} (${c.cond}${c.note ? ', ' + c.note : ''})`).join(' ; '), 8);
}

const WB_PRESETS = {
  'Apoptose': [['MCL-1',40,'Lapin'],['Caspase-3 clivée',17,'Lapin'],['β-Actine',42,'Souris',1]],
  'Survie': [['Akt total',60,'Lapin'],['p-Akt (Ser473)',60,'Lapin'],['GAPDH',37,'Souris',1]],
  'Sénescence': [['p16 (INK4a)',16,'Lapin'],['p21 (WAF1/CIP1)',21,'Lapin'],['Lamin B1',66,'Lapin'],['GAPDH',37,'Souris',1]],
  'Fer': [['GPX4',19,'Lapin'],['Ferritine H (FTH1)',21,'Lapin'],['TFR1 (CD71)',90,'Souris'],['β-Actine',42,'Souris',1]],
  'Mitochondrie': [['TOMM20',16,'Lapin'],['VDAC1',32,'Lapin'],['HSP60',60,'Souris'],['β-Actine',42,'Souris',1]],
  'Lysosomes': [['LC3B-II',15,'Lapin'],['Cathepsine D mature',28,'Lapin'],['LAMP1',120,'Souris'],['β-Actine',42,'Souris',1]]

const QPCR_PRESETS = { 'Référence': ['Rplp0','Hprt1'], 'Sénescence': ['Cdkn2a','Cdkn1a','Il6','Lmnb1'] };
function lib(){ const l = store('lm_lib') || {}; l.antibodies = l.antibodies || []; l.primers = l.primers || []; return l; }
function learn(kind, items){ const l = lib(); items.forEach(it => { const k = (it.name||it.gene||'').toLowerCase(); if(!k) return; const arr = l[kind]; const i = arr.findIndex(x => (x.name||x.gene||'').toLowerCase() === k); if(i >= 0) arr[i] = it; else arr.push(it); }); store('lm_lib', l); }
function ensurePlan(a){
  const kind = a.kind || kindOf(a.type);
  const smp = samplesFor(a);
  if(!a.plan || a.plan.kind !== kind){
    if(kind === 'wb') a.plan = { kind, mass:20, vfinal:15, comb:10, samples:[], gels:[], targets:[] };
    else a.plan = { kind:'rtqpcr', samples:[], targets:[], ntc:true, rtNg:1000 };
  }
  const old = Object.fromEntries((a.plan.samples||[]).map(s => [s.key, s]));
  a.plan.samples = smp.map(s => Object.assign({ key:s.key, name:s.name }, old[s.key]||{}, { name:s.name, excluded:s.excluded, conta:s.conta, wells:s.wells, color:s.color }));
  if(kind === 'wb' && !a.plan.gels.length) autoGel(a.plan);
  return a.plan;
}
function wbCalc(p, s){
  const c = num(s.conc), mass = num(s.mass ?? p.mass) ?? 20, vf = num(s.vfinal ?? p.vfinal) ?? 15;
  const lae = vf/4; if(!c) return { lys:null, h2o:null, lae, warn:'' };
  const lys = mass/c, h2o = vf - lys - lae;
  return { lys, h2o, lae, warn: h2o < 0 ? 'Trop dilué : baisse la masse ou augmente le volume' : '' };
}
function autoGel(p){ const smp = p.samples.filter(s => !s.excluded).map(s => s.key); const per = (p.comb||10) - 1; p.gels = []; for(let i=0;i<Math.max(1, smp.length);i+=per){ const g = ['L', ...smp.slice(i, i+per)]; while(g.length < p.comb) g.push(''); p.gels.push(g); } }
function rtCalc(p, s){ const c = num(s.arn); const ng = num(p.rtNg) ?? 1000; if(!c) return { v:null, h2o:null, flags:[] }; const v = ng/c, h2o = 20 - 4 - v; const flags = []; if(c < 100) flags.push('[ARN] < 100'); if(num(s.r280) != null && num(s.r280) <= 1.8) flags.push('A260/280 ≤ 1,8'); if(num(s.r230) != null && num(s.r230) < 2) flags.push('A260/230 < 2,0'); if(v > 16) flags.push('V ARN > 16 µL'); return { v, h2o, flags }; }
function layout384(p){
  const smp = p.samples.filter(s => !s.excluded); const tg = p.targets.filter(t => t.gene);
  const plates = []; const rowsL = 'ABCDEFGHIJKLMNOP';
  for(let si=0; si < Math.max(1, smp.length); si += 12){ for(let ti=0; ti < Math.max(1, tg.length); ti += 10){
    const wells = {}; const ss = smp.slice(si, si+12), tt = tg.slice(ti, ti+10);
    tt.forEach((t, k) => { const half = k < 5 ? 0 : 1, r0 = (k % 5) * 3;
      ss.forEach((s, j) => { for(let rep=0; rep<3; rep++) wells[rowsL[r0+rep] + (half*12 + j + 1)] = { t: ti+k, s: si+j, rep }; });
      if(p.ntc) wells['P' + (half*12 + (k%5) + 1)] = { t: ti+k, ntc: true }; });
    plates.push({ wells, samples: ss.map((s,j) => ({ n: si+j+1, name: s.name })), targets: tt.map((t,k) => ({ i: ti+k, gene: t.gene })) });

function pdfTxt(s){ return String(s ?? '').replace(/[−–—]/g,'-').replace(/→/g,'->').replace(/←/g,'<-').replace(/β/g,'beta').replace(/α/g,'alpha').replace(/Δ/g,'delta ').replace(/μ/g,'µ').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/[₀-₉]/g, c => String(c.charCodeAt(0) - 0x2080)).replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/…/g,'...').replace(/❄️|❄/g,'').replace(/[^\x00-\xFF]/g,''); }
async function newDoc(title, sub){ await needLib('jspdf'); const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' }); docHeader(doc, title, sub); return doc; }
function docHeader(doc, title, sub){ doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(22,33,43); doc.text(pdfTxt(title), 14, 16); doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(91,107,121); doc.text(pdfTxt(sub||''), 14, 22); doc.setTextColor(22,33,43); doc.setDrawColor(179,38,79); doc.setLineWidth(.6); doc.line(14, 25, 196, 25); doc.__y = 30; }
function newPage(doc, title, sub){ doc.addPage(); docHeader(doc, title, sub); }
function ensureY(doc, h){ if(doc.__y + h > 280){ doc.addPage(); doc.__y = 16; } }
function h2(doc, t){ ensureY(doc, 14); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(pdfTxt(t), 14, doc.__y + 4); doc.setFont('helvetica','normal'); doc.__y += 8; }
function para(doc, t, size = 9){ if(!t) return; doc.setFontSize(size); const lines = doc.splitTextToSize(pdfTxt(t), 182); ensureY(doc, lines.length*4 + 2); doc.text(lines, 14, doc.__y + 3); doc.__y += lines.length*4 + 2; }
function table(doc, head, body, opt = {}){ if(!body.length) return; doc.autoTable(Object.assign({ startY: doc.__y, head:[head.map(pdfTxt)], body: body.map(r => r.map(c => pdfTxt(c))), styles:{ fontSize:8, cellPadding:1.4, lineColor:[213,220,227], lineWidth:.1 }, headStyles:{ fillColor:[179,38,79], textColor:255 }, alternateRowStyles:{ fillColor:[243,245,247] }, margin:{ left:14, right:14 } }, opt)); doc.__y = doc.lastAutoTable.finalY + 5; }
function docFooter(doc){ const n = doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(7); doc.setTextColor(120); doc.text(pdfTxt(`LabMate · semaine du ${S.week_start} · ${new Date().toLocaleString('fr-FR',{timeZone:TZ})} · page ${i}/${n}`), 14, 290); doc.setTextColor(22,33,43); } }
function rgb(h){ const n = parseInt(String(h||'#888888').slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }

function pdfWeek(doc){

    layout384(p).forEach((pl, i) => { if(!tg.length) return; doc.addPage(); doc.__y = 16; h2(doc, `Plaque 384${i ? ' n°' + (i+1) : ''} · ${a.code}`); const cs = 7.2, x0 = 16, y0 = doc.__y; doc.setFontSize(5);

async function weekFolderOf(ws, log){ if(ws === S.week_start){ const f = await ensureFolder(IDS.toAnalyse, 'Semaine_' + ws, log); S.driveFolderId = f.id; return f; } const f = await findChild(IDS.toAnalyse, 'Semaine_' + ws, true); return f[0] || null; }
async function manipFolderIn(weekId, num2, title, log){
  const p = await call(DRIVE, 'search_files', { query: `parentId = '${weekId}' and mimeType = 'application/vnd.google-apps.folder'`, excludeContentSnippets: true, pageSize: 100 });
  const hit = (p?.files||[]).find(f => f.title.startsWith(num2 + '_') || f.title.startsWith('M' + num2 + '_'));
  if(hit) return hit;
  return title ? ensureFolder(weekId, `${num2}_${safeName(title)}`, log) : null;
}
async function foldersForAnalysis(a, log = () => {}){
  const out = new Map(); let fallback = false;
  for(const x of a.sources||[]){
    let f = null;
    if(x.kind === 'manip'){ const m = S.manipulations.find(y => y.id === x.manipId); if(m){ const w = await weekFolderOf(S.week_start, log); f = await ensureFolder(w.id, manipFolderTitle(m), log); m.driveFolderId = f.id; } }
    else { const it = stockItems().find(i => i.id === x.id); const ws = it?.srcKey?.split('|')[0]; const code = (/_M(\d+)_P\d+$/.exec(it?.label || '') || [])[1];
      if(ws && code){ const live = ws === S.week_start && S.manipulations.find(m => m.code === 'M' + code); const w = await weekFolderOf(ws, log); if(w) f = await manipFolderIn(w.id, code, live ? live.title : null, log); } }
    if(f) out.set(f.id, f); else fallback = true;
  }
  if(fallback || !out.size){ const w = await weekFolderOf(S.week_start, log); const f = await ensureFolder(w.id, `${a.code}_${safeName(a.type)}`, log); out.set(f.id, f); }
  return [...out.values()];
}
function anaBase(a){ return `S${isoWeek(S.week_start)}_${a.code}_${safeName(a.type).replace(/\s+/g,'-')}`; }
async function saveAnalysisFiles(a, log = () => {}){

async function saveRun(r){

async function extractText(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.pdf')){ await needLib('pdfjs'); const lib = window.pdfjsLib; const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported:false }).promise; let out = ''; for(let i=1;i<=doc.numPages;i++){ const pg = await doc.getPage(i); const tc = await pg.getTextContent(); out += tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('') + '\n\n'; } return out; }
  if(name.endsWith('.docx')){ await needLib('mammoth'); const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() }); return r.value; }
  if(/\.(html?|xml)$/.test(name)){ const d = new DOMParser().parseFromString(await file.text(), 'text/html'); d.querySelectorAll('script,style,svg').forEach(x => x.remove()); return d.body.innerText || d.body.textContent; }
  return file.text();
}
const IMPORT_PROMPT = `Tu convertis un protocole de laboratoire (biologie cellulaire et moléculaire, équipe de recherche INSERM) en JSON structuré pour une application de paillasse.
Règles :
- Français. Garde EXACTEMENT les volumes, concentrations, températures, vitesses et durées du texte. N'invente aucune valeur : si une info manque, ne la mets pas.
- Découpe en sections (grandes parties) puis en étapes courtes et actionnables, dans l'ordre.
- "min" = durée d'attente en minutes UNIQUEMENT si le texte donne une durée explicite pour cette étape (incubation, centrifugation…) ; sinon omets "min".
- "meta" = repère court (ex. "10 min à 55 °C", "3 min à 12 000 g", "sur glace").
- "critical": true seulement pour les points que le texte signale comme critiques.
- "notes" = consignes générales (sécurité, froid, marges N+1…).
- "kind" = "wb" si western blot, "rtqpcr" si extraction ARN / RT / qPCR, sinon "generic".
Réponds UNIQUEMENT avec ce JSON :
{"title": string, "kind": "wb"|"rtqpcr"|"generic", "notes": [string], "sections": [{"title": string, "steps": [{"title": string, "detail": string, "meta": string, "min": number, "critical": boolean}]}]}`;

function copyManip(x){
