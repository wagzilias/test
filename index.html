/* ---------- Molarity calculator ---------- */
const MW_PRESETS = [['NaCl',58.44],['KCl',74.55],['Tris base',121.14],['Tris-HCl',157.6],['EDTA disodique ·2H₂O',372.24],['HEPES',238.3],['Glycine',75.07],['SDS',288.38],['DTT',154.25],['MgCl₂ ·6H₂O',203.3],['CaCl₂ ·2H₂O',147.01],['D-Glucose',180.16],['Saccharose',342.3],['DMSO',78.13],['Bafilomycine A1',622.83],['Doxorubicine HCl',579.98],['Chloroquine diphosphate',515.86],['Rapamycine',914.17]];
const U_MOL = { 'M':1, 'mM':1e-3, 'µM':1e-6, 'nM':1e-9, 'pM':1e-12 };
const U_MASS = { 'g/L':1, 'mg/mL':1, 'µg/mL':1e-3, 'ng/mL':1e-6, 'µg/µL':1, '% (m/v)':10 };
const U_VOL = { 'L':1, 'mL':1e-3, 'µL':1e-6 };
const U_X = { 'X':1 };
let CALC = store('lm_calc') || {};
function cv(k, d){ return CALC[k] ?? d; }
function uOpts(sets, sel){ return sets.map(([lab, set]) => `<optgroup label="${lab}">${Object.keys(set).map(u => `<option ${u === sel ? 'selected' : ''}>${u}</option>`).join('')}</optgroup>`).join(''); }
function uKind(u){ return u in U_MOL ? ['mol', U_MOL[u]] : u in U_MASS ? ['mass', U_MASS[u]] : u in U_X ? ['x', 1] : u in U_VOL ? ['vol', U_VOL[u]] : [null, 1]; }
function fmtU(v, units){ if(v == null || !isFinite(v)) return '—'; const list = Object.entries(units).sort((a,b) => b[1] - a[1]); for(const [u, f] of list){ if(Math.abs(v) >= f * 0.999 || f === list[list.length-1][1]) return `${(+(v/f).toPrecision(4)).toLocaleString('fr-FR')} ${u}`; } }
const MASS_OUT = { 'g':1, 'mg':1e-3, 'µg':1e-6, 'ng':1e-9 }, VOL_OUT = { 'L':1, 'mL':1e-3, 'µL':1e-6, 'nL':1e-9 }, MOL_OUT = { 'M':1, 'mM':1e-3, 'µM':1e-6, 'nM':1e-9 };
function renderCalc(){
  const ms = S.manipulations;
  $('#v-calc').innerHTML = `<div class="vh"><div><h1>Molarity calculator</h1><p>Pesées, dilutions, remise en solution et ensemencement. Les valeurs restent dans ce navigateur.</p></div></div>
    ${datalist('dl-mw', MW_PRESETS.map(x => x[0]))}
    <div class="cgrid">
      <div class="card" id="c-mass"><h2>Masse à peser</h2>
        <label class="f" for="cm-name">Composé (facultatif)<input type="text" id="cm-name" list="dl-mw" value="${esc(cv('cm-name',''))}" placeholder="ex. NaCl"></label>
        <label class="f" for="cm-mw">Masse molaire (g/mol)<input type="text" inputmode="decimal" id="cm-mw" value="${esc(cv('cm-mw','58.44'))}"></label>
        <div class="grid2"><label class="f" for="cm-c">Concentration voulue<span class="unit"><input type="text" inputmode="decimal" id="cm-c" value="${esc(cv('cm-c','150'))}"><select id="cm-cu" aria-label="Unité">${uOpts([['Molaire', U_MOL]], cv('cm-cu','mM'))}</select></span></label>
        <label class="f" for="cm-v">Volume final<span class="unit"><input type="text" inputmode="decimal" id="cm-v" value="${esc(cv('cm-v','500'))}"><select id="cm-vu" aria-label="Unité">${uOpts([['Volume', U_VOL]], cv('cm-vu','mL'))}</select></span></label></div>
        <div class="res" id="cm-out"></div></div>
      <div class="card" id="c-dil"><h2>Dilution C₁V₁ = C₂V₂</h2>
        <label class="f" for="cd-c1">Solution mère (C₁)<span class="unit"><input type="text" inputmode="decimal" id="cd-c1" value="${esc(cv('cd-c1','10'))}"><select id="cd-c1u" aria-label="Unité">${uOpts([['Molaire', U_MOL],['Massique', U_MASS],['Facteur', U_X]], cv('cd-c1u','mM'))}</select></span></label>
        <label class="f" for="cd-c2">Concentration finale (C₂)<span class="unit"><input type="text" inputmode="decimal" id="cd-c2" value="${esc(cv('cd-c2','100'))}"><select id="cd-c2u" aria-label="Unité">${uOpts([['Molaire', U_MOL],['Massique', U_MASS],['Facteur', U_X]], cv('cd-c2u','nM'))}</select></span></label>
        <label class="f" for="cd-v2">Volume final (V₂)<span class="unit"><input type="text" inputmode="decimal" id="cd-v2" value="${esc(cv('cd-v2','12'))}"><select id="cd-v2u" aria-label="Unité">${uOpts([['Volume', U_VOL]], cv('cd-v2u','mL'))}</select></span></label>
        <div class="res" id="cd-out"></div></div>
      <div class="card" id="c-rec"><h2>Remise en solution</h2>
        <p class="small muted" style="margin:0">siRNA, oligos, poudre lyophilisée : quel volume de solvant pour la concentration voulue ?</p>
        <div class="grid2"><label class="f" for="cr-q">Quantité dans le tube<span class="unit"><input type="text" inputmode="decimal" id="cr-q" value="${esc(cv('cr-q','5'))}"><select id="cr-qu" aria-label="Unité">${['nmol','µmol','mg','µg'].map(u => `<option ${u === cv('cr-qu','nmol') ? 'selected' : ''}>${u}</option>`).join('')}</select></span></label>
        <label class="f" for="cr-c">Concentration voulue<span class="unit"><input type="text" inputmode="decimal" id="cr-c" value="${esc(cv('cr-c','20'))}"><select id="cr-cu" aria-label="Unité">${uOpts([['Molaire', U_MOL],['Massique', U_MASS]], cv('cr-cu','µM'))}</select></span></label></div>
        <label class="f" for="cr-mw">Masse molaire (g/mol), si masse et molarité se mélangent<input type="text" inputmode="decimal" id="cr-mw" value="${esc(cv('cr-mw',''))}" placeholder="ex. 13 300 pour un siRNA"></label>
        <div class="res" id="cr-out"></div></div>
      <div class="card" id="c-seed"><h2>Ensemencement</h2>
        <label class="f" for="cs-m">Remplir depuis une manip<select id="cs-m"><option value="">—</option>${ms.map(m => `<option value="${m.id}">${esc(m.code)} · ${esc(m.title || 'Sans titre')} (${esc(m.cellCount)}/puits)</option>`).join('')}</select></label>
        <div class="grid2"><label class="f" for="cs-cc">Comptage (cellules/mL)<input type="text" id="cs-cc" value="${esc(cv('cs-cc','1.2M'))}" placeholder="ex. 1.2M"></label>
        <label class="f" for="cs-cw">Cellules / puits<input type="text" id="cs-cw" value="${esc(cv('cs-cw','100k'))}"></label>
        <label class="f" for="cs-w">Puits au total<input type="number" id="cs-w" min="1" value="${esc(cv('cs-w','24'))}"></label>
        <label class="f" for="cs-vw">Volume / puits (mL)<input type="text" inputmode="decimal" id="cs-vw" value="${esc(cv('cs-vw','0.5'))}"></label>
        <label class="f" for="cs-ex">Excès (%)<input type="number" id="cs-ex" min="0" max="50" value="${esc(cv('cs-ex','10'))}"></label></div>
        <div class="res" id="cs-out"></div></div>
    </div>`;
  const val = id => num($('#' + id).value);
  const out = (id, ok, main, sub) => { const o = $('#' + id); o.className = 'res' + (ok ? '' : ' bad'); o.innerHTML = `<b>${main}</b>${sub ? `<small>${sub}</small>` : ''}`; };
  const calc = () => {
    // masse
    const mw = val('cm-mw'), c = val('cm-c') * U_MOL[$('#cm-cu').value], v = val('cm-v') * U_VOL[$('#cm-vu').value];
    if(mw && c && v){ const g = c * v * mw; out('cm-out', true, fmtU(g, MASS_OUT), `m = C × V × M = ${f1(val('cm-c'),3)} ${$('#cm-cu').value} × ${f1(val('cm-v'),3)} ${$('#cm-vu').value} × ${f1(mw,2)} g/mol`); }
    else out('cm-out', false, 'Renseigne la masse molaire, la concentration et le volume.');
    // dilution
    const [k1, f1u] = uKind($('#cd-c1u').value), [k2, f2u] = uKind($('#cd-c2u').value);
    const c1 = val('cd-c1') * f1u, c2 = val('cd-c2') * f2u, v2 = val('cd-v2') * U_VOL[$('#cd-v2u').value];
    if(k1 !== k2) out('cd-out', false, 'C₁ et C₂ doivent être dans le même type d\'unité (molaire, massique ou facteur X).');
    else if(!(c1 && c2 && v2)) out('cd-out', false, 'Renseigne C₁, C₂ et V₂.');
    else if(c2 > c1) out('cd-out', false, 'C₂ est plus concentrée que la solution mère.');
    else { const v1 = c2 * v2 / c1; out('cd-out', true, `${fmtU(v1, VOL_OUT)} de solution mère`, `+ ${fmtU(v2 - v1, VOL_OUT)} de diluant · dilution au 1/${f1(c1/c2, 1)}` + (v1 < 5e-7 ? `<br>Moins de 0,5 µL à pipeter : fais d'abord une dilution intermédiaire (par ex. au 1/${(c1/c2) >= 1e4 ? 100 : 10}).` : '')); }

    let mol = null, gram = null; if(q){ if(qu === 'nmol') mol = q*1e-9; if(qu === 'µmol') mol = q*1e-6; if(qu === 'mg') gram = q*1e-3; if(qu === 'µg') gram = q*1e-6; }
    if(mol == null && gram != null && kc === 'mol' && mwr) mol = gram / mwr;
    if(gram == null && mol != null && kc === 'mass' && mwr) gram = mol * mwr;
    if(!q || !cc) out('cr-out', false, 'Renseigne la quantité et la concentration.');
    else if(kc === 'mol' && mol != null) out('cr-out', true, `${fmtU(mol / cc, VOL_OUT)} de solvant`, `V = n / C = ${f1(q,3)} ${qu} ÷ ${f1(val('cr-c'),3)} ${$('#cr-cu').value}`);
    else if(kc === 'mass' && gram != null) out('cr-out', true, `${fmtU(gram / cc, VOL_OUT)} de solvant`, `V = m / C = ${f1(q,3)} ${qu} ÷ ${f1(val('cr-c'),3)} ${$('#cr-cu').value}`);
    else out('cr-out', false, 'Ajoute la masse molaire pour passer de la masse à la molarité.');
    // ensemencement
    const cnt = parseCells($('#cs-cc').value), cw = parseCells($('#cs-cw').value), nw = +$('#cs-w').value || 0, vw = val('cs-vw'), ex = 1 + (+$('#cs-ex').value || 0)/100;
    if(cnt && cw && nw && vw){ const cells = cw * nw * ex, vs = cells / cnt, vt = vw * nw * ex;
      out('cs-out', vs <= vt, vs <= vt ? `${f1(vs, 2)} mL de suspension` : `Suspension trop diluée : il faut ${f1(vs,2)} mL pour ${f1(vt,2)} mL au total`, `+ ${f1(Math.max(0, vt - vs), 2)} mL de milieu · ${fmtCells(Math.round(cells))} cellules · ${f1(vt,2)} mL au total (excès compris)`); }
    else out('cs-out', false, 'Renseigne le comptage, la densité, le nombre de puits et le volume.');
    document.querySelectorAll('#v-calc input,#v-calc select').forEach(i => { if(i.id && i.id !== 'cs-m') CALC[i.id] = i.value; }); store('lm_calc', CALC);
  };
  document.querySelectorAll('#v-calc input,#v-calc select').forEach(i => i.oninput = i.onchange = calc);
  $('#cm-name').onchange = () => { const p = MW_PRESETS.find(x => x[0].toLowerCase() === $('#cm-name').value.trim().toLowerCase()); if(p) $('#cm-mw').value = p[1]; calc(); };

  calc();
}

function groupStats(r, v){
  const rows = (v?.data?.rows || []).filter(x => x.value != null && isFinite(x.value) && !x.excluded);
  const groups = (r.plate?.groups || []).map(g => g.name); rows.forEach(x => { if(!groups.includes(x.g)) groups.push(x.g); });
  const base = v?.normalize ? (() => { const c = rows.filter(x => x.g === v.normalize).map(x => x.value); return c.length ? c.reduce((a,b) => a+b, 0) / c.length : null; })() : null;
  return groups.map(name => { const vals = rows.filter(x => x.g === name).map(x => base ? x.value / base : x.value); const n = vals.length; const mean = n ? vals.reduce((a,b) => a+b, 0) / n : null;
    const sd = n > 1 ? Math.sqrt(vals.reduce((a,b) => a + (b-mean)**2, 0) / (n-1)) : null; const g = r.plate?.groups?.find(x => x.name === name);
    return { name, color: g?.color || '#8a97a3', n, mean, sd, sem: sd != null ? sd / Math.sqrt(n) : null, vals, reps: rows.filter(x => x.g === name).map(x => x.rep) }; }).filter(s => s.n);
}

function niceMax(x){ if(!(x > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))); const m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }

  const mini = !!opt.mini, W = opt.w || 560, H = opt.h || 360, ml = mini ? 34 : 64, mr = 12, mt = mini ? 12 : 46, mb = mini ? 34 : 64, pw = W - ml - mr, ph = H - mt - mb, fs = mini ? 11 : 12.5;

  const top = niceMax(Math.max(...st.map(s => Math.max(s.mean + (s.sd||0), ...s.vals))) * 1.05); const y = val => mt + ph - (val / top) * ph;

  if(!mini) o += `<text x="${ml}" y="20" font-size="15" font-weight="700" fill="${T.fg}">${esc(r.code)} · ${esc(r.title)}</text><text x="${ml}" y="37" font-size="12" fill="${T.muted}">${esc(r.source?.code || '')} · v${v.v} · moyenne ± écart-type, un point par réplicat</text>`;
  for(let i = 0; i <= 4; i++){ const val = top * i / 4, yy = y(val); o += `<line x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}" stroke="${T.line}" stroke-width="1"/><text x="${ml - 8}" y="${yy + 4}" text-anchor="end" font-size="${fs}" fill="${T.muted}">${(+val.toPrecision(3)).toLocaleString('fr-FR')}</text>`; }

    o += `<path d="M${cx - bar/2} ${y0}V${yt + rr}Q${cx - bar/2} ${yt} ${cx - bar/2 + rr} ${yt}H${cx + bar/2 - rr}Q${cx + bar/2} ${yt} ${cx + bar/2} ${yt + rr}V${y0}Z" fill="${s.color}" fill-opacity=".85"/>`;
    if(s.sd != null){ const a = y(s.mean + s.sd), b = y(Math.max(0, s.mean - s.sd)); o += `<path d="M${cx} ${a}V${b}M${cx - 7} ${a}H${cx + 7}M${cx - 7} ${b}H${cx + 7}" stroke="${T.fg}" stroke-width="2" fill="none"/>`; }

}

function parseResultCSV(text, groups){

  const head = cells[0].map(h => h.toLowerCase()); const hasHead = head.some(h => /group|condition|valeur|value|r[ée]plicat|pool|sample|échantillon/.test(h));
  const gi = hasHead ? Math.max(0, head.findIndex(h => /group|condition|sample|échantillon/.test(h))) : 0;
  const vi = hasHead ? head.findIndex(h => /valeur|value|mesure|fold|ct|rlu/.test(h)) : 1;
  const ri = hasHead ? head.findIndex(h => /r[ée]plicat|pool|rep/.test(h)) : 2;

  return cells.slice(hasHead ? 1 : 0).map(c => { const raw = c[gi] || ''; const g = groups.find(x => x.name.toLowerCase() === raw.toLowerCase() || x.code.toLowerCase() === raw.toLowerCase())?.name || raw;

}

async function importRaw(r, files){

  confirmSheet(`Importer ${rows.length} fichier(s) brut(s) dans ${esc(r.code)} ?`, `<div class="tbl"><table>${rows.map(x => `<tr><td>${esc(x.f.name)}</td><td class="mono">${fmtBytes(x.f.size)}</td><td class="mono small">${x.sha.slice(0, 20)}…</td><td>${x.f.size > RAW_MAX ? 'trop gros pour l\'envoi : empreinte gardée, fichier à déposer à la main' : 'envoi puis relecture'}</td></tr>`).join('')}</table></div>${dup.length ? `<p style="color:var(--warn)">${dup.length} fichier(s) déjà importé(s) (même empreinte).</p>` : ''}<p>Les fichiers partent tels quels dans <b>${esc(r.code)}_…/brut</b> sur le Drive ; LabMate ne les modifie ni ne les supprime jamais.</p>`, 'Importer', async () => {

        if(x.f.size <= RAW_MAX){ const exist = await findChild(brut, x.f.name, false); const name = exist.length ? x.f.name.replace(/(\.[^.]+)?$/, `_${x.sha.slice(0, 8)}$1`) : x.f.name; rec.name = name;
          const c = await call(DRIVE, 'create_file', { parentId: brut, title: name, base64Content: bufToB64(x.buf), contentMimeType: rec.type, disableConversionToGoogleType: true }); rec.driveId = c.id; rec.url = c.viewUrl || '';
          const back = await call(DRIVE, 'download_file_content', { fileId: c.id }); const h = await sha256Hex(b64ToBuf(back.content)); rec.verified = h === x.sha; rec.verifiedAt = new Date().toISOString();
          if(!rec.verified) toast(`${name} : l'empreinte relue ne correspond pas, réimporte le fichier`); }
        r.raw = r.raw || []; r.raw.push(rec); saveDB(); }

}
async function verifyRaw(r, sha){

function resultFiche(r){ const x = clone(r); delete x.dirty; x.versions = (x.versions||[]).map(v => ({ v: v.v, status: v.status, createdAt: v.createdAt, archivedAt: v.archivedAt, reason: v.reason, author: v.author, driveId: v.driveId })); return x; }
async function saveResultToDrive(r){

    for(const v of (r.versions||[]).filter(x => !x.driveId)){ const body = JSON.stringify({ schema:'labmate-result-version-1', result: r.code, ...v, driveId: undefined }, null, 2);
      v.sha256 = await sha256Text(body); const c = await call(DRIVE, 'create_file', { parentId: folder, title: `${r.code}_v${v.v}.json`, textContent: body, contentMimeType:'application/json', disableConversionToGoogleType:true }); v.driveId = c.id; saveDB(); }

async function loadDataIndex(force){

    const root = await findChild(IDS.analysed, RES_DIR, true);

      if(f.length){ const p = await call(DRIVE, 'download_file_content', { fileId: f[0].id }); const d = JSON.parse(b64ToText(p.content));
        (d.results||[]).forEach(x => { const loc = resById(x.id); if(!loc) DB.results.push({ ...x, dirty: false }); else if(force && !loc.dirty && !(loc.versions||[]).some(v => !v.driveId)) Object.assign(loc, x, { dirty: false }); });
        DB.seq.R = Math.max(DB.seq.R || 0, d.seq?.R || 0, ...DB.results.map(r => +String(r.code).slice(1) || 0)); } }
    const nb = await findChild(IDS.manips, NB_DIR, true);
    if(nb.length){ DB.nbFolderId = nb[0].id; let all = [], token; do{ const p = await call(DRIVE, 'search_files', { query: `parentId = '${nb[0].id}' and title contains 'E'`, excludeContentSnippets: true, pageSize: 100, ...(token ? { pageToken: token } : {}) }); const fs = p?.files || []; all = all.concat(fs); token = fs.length ? p?.nextPageToken : null; } while(token && all.length < 2000);
      for(const f of all.filter(f => /^E\d+.*\.json$/.test(f.title) && !DB.notebook.some(e => e.driveId === f.id || f.title.startsWith(e.code + '_')))){ const p = await call(DRIVE, 'download_file_content', { fileId: f.id }); const e = JSON.parse(b64ToText(p.content)); e.driveId = f.id; DB.notebook.push(e); }

  const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_16x9'; pptx.title = SL.title || STRUCTS[SL.structure]; pptx.author = SL.author || profile.name;
  for(const [i, s] of SL.slides.entries()){
    const sl = pptx.addSlide(); sl.background = { color: 'FFFFFF' };
    sl.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 10, h: .12, fill: { color: P } }); sl.addShape(pptx.ShapeType.rect, { x: 6.5, y: 0, w: 3.5, h: .12, fill: { color: A } });
    sl.addText(`${SL.lab}    ${i + 1} / ${SL.slides.length}`, { x: .4, y: 5.25, w: 9.2, h: .3, fontSize: 9, color: '6A6590', align: 'right' });
    if(SL.logo) sl.addImage({ data: SL.logo, x: .4, y: 5.18, w: .45, h: .35, sizing: { type: 'contain', w: .45, h: .35 } });
    if(s.kind === 'title'){ sl.addText(s.title, { x: .6, y: 1.7, w: 8.8, h: 1.1, fontSize: 34, bold: true, color: '1D1A33' }); sl.addText((s.bullets||[]).filter(Boolean).join('\n'), { x: .6, y: 2.9, w: 8.8, h: 1.3, fontSize: 16, color: '5F5A7D' }); }
    else { sl.addText(s.title, { x: .5, y: .3, w: 9, h: .7, fontSize: 24, bold: true, color: P });

      else sl.addText((s.bullets||[]).filter(Boolean).map(b => ({ text: b, options: { bullet: true } })), { x: .6, y: 1.2, w: 8.8, h: 3.8, fontSize: 18, color: '1D1A33', valign: 'top' }); }

async function makeSlidesPdf(){

  const rgbOf = h => { const x = hex6(h); return [parseInt(x.slice(0,2),16), parseInt(x.slice(2,4),16), parseInt(x.slice(4,6),16)]; };
  const W = 297, sx = 20, sy = 12, sw = 257, sh = sw * 9 / 16;
  for(const [i, s] of SL.slides.entries()){
    if(i) doc.addPage();
    doc.setDrawColor(210, 205, 230); doc.rect(sx, sy, sw, sh); doc.setFillColor(...rgbOf(c.primary)); doc.rect(sx, sy, sw, 3, 'F'); doc.setFillColor(...rgbOf(c.accent)); doc.rect(sx + sw * .65, sy, sw * .35, 3, 'F');
    doc.setTextColor(29, 26, 51);
    if(s.kind === 'title'){ doc.setFontSize(26); doc.text(doc.splitTextToSize(pdfTxt(s.title), sw - 30), sx + 15, sy + 50); doc.setFontSize(13); doc.setTextColor(95, 90, 125); doc.text((s.bullets||[]).filter(Boolean).map(pdfTxt), sx + 15, sy + 75); }
    else { doc.setFontSize(18); doc.setTextColor(...rgbOf(c.primary)); doc.text(doc.splitTextToSize(pdfTxt(s.title), sw - 20), sx + 10, sy + 16); doc.setTextColor(29, 26, 51); doc.setFontSize(12);
      const r = s.resultId && resById(s.resultId), v = r && activeV(r);
      if(r && v){ const png = await svgToPng(figureSVG(r, v, { print: true, w: 560, h: 340 })); doc.addImage(png.dataUrl, 'PNG', sx + 8, sy + 24, 140, 85, undefined, 'FAST'); doc.text(doc.splitTextToSize((s.bullets||[]).filter(Boolean).map(b => '• ' + pdfTxt(b)).join('\n'), 95), sx + 155, sy + 30); }
      else doc.text(doc.splitTextToSize((s.bullets||[]).filter(Boolean).map(b => '• ' + pdfTxt(b)).join('\n'), sw - 30), sx + 12, sy + 32); }
    doc.setFontSize(8); doc.setTextColor(106, 101, 144); doc.text(`${pdfTxt(SL.lab)}   ${i + 1} / ${SL.slides.length}`, sx + sw - 4, sy + sh - 4, { align:'right' });

    doc.text(doc.splitTextToSize(pdfTxt(s.notes || '—'), W - 2 * sx), sx, sy + sh + 16);
  }
  return doc.output('blob');
}

async function thumbOf(file, max){ const img = new Image(); const url = URL.createObjectURL(file); await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; }); const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); return c.toDataURL('image/jpeg', .8); }

/* ---------- plan de plaque sans conditions de base ---------- */
function fixManip(m){
  m.treatments = (m.treatments||[]).map(t => ({ ...t, id: t.id || 't' + Math.random().toString(36).slice(2,7) }));
  m.plate = m.plate || {}; m.plate.conds = m.plate.conds || []; m.plate.wells = m.plate.wells || {}; m.plate.tx = m.plate.tx || {};
  const [R, C] = PRESETS.plates[m.plateType] || [4,6]; const rows = 'ABCDEFGHIJKLMNOP'; const all = [];
  for(let r = 0; r < R && all.length < (+m.wellsCount || R*C); r++) for(let c = 1; c <= C && all.length < (+m.wellsCount || R*C); c++) all.push(rows[r] + c);
  m.plate.all = all;
  return m;
}
function usedWells(plate){
  const s = new Set(Object.keys(plate?.wells||{}).filter(k => plate.wells[k] !== 'x'));
  (plate?.all||[]).forEach(k => { if(plate.wells?.[k] !== 'x') s.add(k); });
  Object.values(plate?.tx||{}).forEach(l => (l||[]).forEach(k => { if(plate.wells?.[k] !== 'x') s.add(k); }));
  return [...s].sort(wellSort);

  const draw = now => {
    if(now - last > 33){ last = now; const { ctx, w, h } = fitCanvas(cv); ctx.clearRect(0, 0, w, h);
      const target = wave.mode === 'live' ? 1 : wave.mode === 'think' ? .7 : .35; amp += (target - amp) * .08; ph += wave.mode === 'idle' ? .03 : .09;
      const n = 46, x0 = w * .12, x1 = w * .88, bw = (x1 - x0) / n;
      const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, '#3fe0f0'); g.addColorStop(.5, '#a77bff'); g.addColorStop(1, '#ff5cc6');
      const glow = ctx.createRadialGradient(w/2, h/2, 4, w/2, h/2, w*.45); glow.addColorStop(0, 'rgba(120,90,255,.35)'); glow.addColorStop(1, 'rgba(120,90,255,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = g;
      for(let i = 0; i < n; i++){ const t = i / n; const env = Math.sin(Math.PI * t) ** 1.4; const v = Math.abs(Math.sin(i * .9 + ph) * .6 + Math.sin(i * 2.3 - ph * 1.7) * .4); const bh = Math.max(2, (h * .78) * env * v * amp);
        ctx.fillRect(x0 + i * bw + bw * .2, h/2 - bh/2, Math.max(1.2, bw * .5), bh); } }
    if(!REDUCED || wave.mode !== 'idle') requestAnimationFrame(draw); else setTimeout(() => requestAnimationFrame(draw), 1000);
  };
  requestAnimationFrame(draw);
})();

/* ---------- Version autonome : connexion Google et clé Claude ---------- */
const _renderSettingsPC = renderSettings;
renderSettings = function(){
  _renderSettingsPC();
  const host = $('#v-settings'); if(!host || !window.__gshim) return;
  const st = __gshim.state();
  const card = document.createElement('div'); card.className = 'card'; card.id = 'sa-card';
  card.innerHTML = `<div class="spread"><h3>Connexion Google et Claude</h3><span class="st ${st.consent ? 'new' : 'upd'}">${st.consent ? 'Google connecté' : 'Google non connecté'}</span></div>
    <label class="f" for="sa-cid">Identifiant client Google (OAuth)<input type="text" id="sa-cid" value="${esc(st.clientId)}" placeholder="123456-abc.apps.googleusercontent.com" autocomplete="off"></label>
    <div class="row"><button class="btn primary" id="sa-in">${st.consent ? 'Se reconnecter' : 'Se connecter à Google'}</button>${st.consent ? '<button class="btn ghost" id="sa-out">Se déconnecter</button>' : ''}</div>
    <span class="small muted">Une seule fois : console.cloud.google.com, nouveau projet, activer « Google Drive API » et « Google Calendar API », écran de consentement (externe, ajoute ton adresse comme utilisateur test), puis Identifiants > ID client OAuth > Application Web. Ajoute cette adresse comme « Origine JavaScript autorisée » : <span class="mono">${esc(st.origin)}</span></span>
    <label class="f" for="sa-key" style="margin-top:10px">Clé API Claude (facultative, pour l'assistant et l'import de protocoles)<input type="text" id="sa-key" style="-webkit-text-security:disc" value="" placeholder="${st.apiKey ? '•••••• enregistrée' : 'sk-ant-…'}" autocomplete="off"></label>
    <div class="row"><button class="btn" id="sa-savekey">Enregistrer la clé</button>${st.apiKey ? '<button class="btn ghost" id="sa-rmkey">Retirer la clé</button>' : ''}</div>
    <span class="small muted">Identifiant et clé restent dans ce navigateur, sur cet appareil. Les accès Drive et Agenda se font directement avec ton compte Google.</span>`;
  host.insertBefore(card, host.children[1] || null);
  $('#sa-in').onclick = async () => { __gshim.setClientId($('#sa-cid').value); try{ await __gshim.signIn(); toast('Google connecté'); location.reload(); }catch(e){ toast('Connexion impossible : ' + (e?.message || e?.code || e)); } };
  const out = $('#sa-out'); if(out) out.onclick = () => { __gshim.signOut(); location.reload(); };
  $('#sa-savekey').onclick = () => { const v = $('#sa-key').value.trim(); if(!v){ toast('Colle d\'abord la clé'); return; } __gshim.setApiKey(v); toast('Clé enregistrée'); location.reload(); };
  const rm = $('#sa-rmkey'); if(rm) rm.onclick = () => { __gshim.setApiKey(''); location.reload(); };
};
if(!__gshim.state().clientId || !__gshim.state().consent){ try{ if(!sessionStorage.getItem('lm_sa_first')){ sessionStorage.setItem('lm_sa_first', '1'); setTimeout(() => go('settings'), 600); } }catch(e){} }
</script>
